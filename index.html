<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新模型选股推荐</title><style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#172033;margin:0}main{width:min(1500px,96%);margin:24px auto}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 24px;border:1px solid #ccd5e1;background:#fff;border-radius:8px;cursor:pointer}.tabs .on{background:#2563eb;color:#fff}.performance,.gate,.model{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:16px;margin:15px 0}.performance{border-color:#bfdbfe}.performance h2{margin:0 0 8px}.performance .note{color:#64748b;line-height:1.7}.session{border:1px solid #dbe4ef;border-radius:9px;margin-top:12px;padding:0 12px}.session summary{cursor:pointer;padding:13px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.metric{padding:5px 10px;border-radius:999px;background:#f1f5f9;color:#334155;font-weight:700;font-size:13px}.pos{color:#dc2626;font-weight:700}.neg{color:#16a34a;font-weight:700}.flat{color:#64748b}.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gate label{font-weight:700}.gate input{width:150px;padding:9px 10px;border:1px solid #ccd5e1;border-radius:8px}.gate button{padding:9px 16px;border:1px solid #2563eb;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.gate span{color:#64748b}.model.featured{border:2px solid #f59e0b;box-shadow:0 10px 24px rgba(245,158,11,.14)}.model.featured .model-title h2{color:#b45309}.model-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.model-title h2{margin:0;font-size:28px;line-height:1.2}.counts{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#eef6ff;color:#1d4ed8;font-size:14px;font-weight:700}.badge.obs{background:#fff7ed;color:#c2410c}.badge.key{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;margin-bottom:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}.sub-title{display:flex;align-items:baseline;gap:8px}.subhead h3{margin:0;font-size:17px;line-height:1.2}.hint{color:#64748b;font-size:13px}.count-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#fff;color:#334155;border:1px solid #e2e8f0;font-size:13px;font-weight:700}.rules{color:#475569;line-height:1.8}.rules.locked{color:#94a3b8}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e5eaf0;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}th{background:#eef2f7}.hide{display:none}.meta{color:#64748b}@media(max-width:640px){.model-title{align-items:flex-start;flex-direction:column}.model-title h2{font-size:24px}.subhead{align-items:flex-start;flex-direction:column}}</style></head><body><main><h1>新模型选股推荐</h1><div id="meta" class="meta"></div><div id="performance"></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"><button data-tab="focus" class="on">重点模型</button><button data-tab="strict">严格条件</button><button data-tab="long">中线</button></div><div id="content"></div><script>
const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function table(rows,emptyText='暂无股票。'){if(!rows.length)return `<p>${esc(emptyText)}</p>`;let ks=Object.keys(rows[0]);return '<div class="wrap"><table><thead><tr>'+ks.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+ks.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}
const RULE_HASH='aee73035ea60b04c339e9363202e5c4c1aac91fa8a0d55c8487fbcf51a1c2ef2';
let data,tab='focus',rulesUnlocked=sessionStorage.getItem('rulesUnlocked')==='1';
async function sha256(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function syncGate(){document.getElementById('ruleMsg').textContent=rulesUnlocked?'条件已解锁':'条件已隐藏'}
function performanceTable(rows){if(!rows.length)return '<p>暂无可评估股票。</p>';let ks=Object.keys(rows[0]);return '<div class="wrap"><table><thead><tr>'+ks.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+ks.map(k=>{let v=r[k],cls=k==='次日涨跌幅%'?(Number(v)>0?'pos':(Number(v)<0?'neg':'flat')):'';return `<td class="${cls}">${esc(v)}</td>`}).join('')+'</tr>').join('')+'</tbody></table></div>'}
function drawPerformance(perf){let el=document.getElementById('performance');if(!perf||!perf.history||!perf.history.length){let pending=perf&&perf.pending?`已记录 ${esc(perf.pending['选股日'])} 的 ${esc(perf.pending['选股数'])} 只股票，下一交易日收盘后生成首期结果。`:'今天模型刚更新，历史复盘从下一次完整运行开始记录。';el.innerHTML=`<section class="performance"><h2>历史命中复盘</h2><p class="note">${pending} 最多保留最近3个已复盘工作日。</p></section>`;return}let sessions=perf.history.map((s,i)=>{let q=s['汇总']||{},models=s['模型汇总']||[];return `<details class="session" ${i===0?'open':''}><summary><strong>选股日 ${esc(s['选股日'])} → 结果日 ${esc(s['结果日'])}</strong><span>有效结果 ${esc(q['有效数'])}/${esc(q['选股数'])} 只</span></summary><div class="metrics"><span class="metric">上涨率 ${esc(q['上涨率%'])}%</span><span class="metric">平均涨幅 ${esc(q['平均涨幅%'])}%</span><span class="metric">上涨 ${esc(q['上涨数'])}</span><span class="metric">下跌 ${esc(q['下跌数'])}</span><span class="metric">涨停 ${esc(q['涨停数'])}</span></div><h3>分模型准确度</h3>${table(models,'暂无模型结果。')}<h3>逐股结果</h3>${performanceTable(s.rows||[])}</details>`}).join('');el.innerHTML=`<section class="performance"><h2>历史命中复盘</h2><p class="note">展示选股后第一个交易日的最终涨跌幅，只统计正式入选，不统计观察池；最多保留3个工作日。</p>${sessions}</section>`}
function draw(){const groups={focus:['首踩10日线','首踩20日线'],strict:['T+1','T1-T5'],long:['中线']};let names=groups[tab];document.getElementById('content').innerHTML=names.map(n=>{let m=data.models[n],obs=m.observation_rows||[],rules=rulesUnlocked?esc(m.rules):'条件已隐藏，输入口令后查看。',locked=rulesUnlocked?'':' locked';let simple=n==='首踩10日线'||n==='首踩20日线',featured=n==='首踩10日线';return `<section class="model${featured?' featured':''}"><div class="model-title"><h2>${n}</h2><div class="counts">${featured?'<span class="badge key">重点</span>':''}<span class="badge">${simple?'推荐':'已确认'} ${m.rows.length}</span>${simple?'':`<span class="badge obs">观察 ${obs.length}</span>`}</div></div><div class="rules${locked}">${rules}</div><div class="subhead"><div class="sub-title"><h3>${simple?'次日观察':'已确认'}</h3></div><span class="count-pill">${m.rows.length} 只</span></div>${table(m.rows,'暂无严格符合条件的股票。')}${simple?'':`<div class="subhead"><div class="sub-title"><h3>观察池</h3><span class="hint">含结构待确认</span></div><span class="count-pill">${obs.length} 只</span></div>${table(obs,'暂无观察池股票。')}`}</section>`}).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));syncGate()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.getElementById('unlockRules').onclick=async()=>{let ok=await sha256(document.getElementById('rulePass').value)===RULE_HASH;rulesUnlocked=ok;if(ok){sessionStorage.setItem('rulesUnlocked','1');document.getElementById('rulePass').value='';draw()}else{document.getElementById('ruleMsg').textContent='口令不正确'}};document.getElementById('rulePass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlockRules').click()});Promise.all([fetch('data/new_models_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/model_performance_latest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([x,performance])=>{data=x;document.getElementById('meta').textContent=`数据日：${x.date}　生成：${x.generated_at}　五笔优先于三笔`;drawPerformance(performance);draw()})</script></main></body></html>
