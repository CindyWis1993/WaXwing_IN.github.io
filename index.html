<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票二次筛选结果</title>
  <style>
    :root { color-scheme:light; --blue:#2563eb; --green:#059669; --red:#dc2626; --line:#e2e8f0; --muted:#64748b; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f8fafc; color:#172033; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    main { width:min(1500px,96%); margin:24px auto 60px; }
    .head { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    h1 { margin:0 0 6px; font-size:28px; } h2 { margin:30px 0 12px; font-size:22px; }
    .meta { color:var(--muted); margin-bottom:20px; }
    select { padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:white; font-size:15px; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); gap:12px; }
    .card { background:white; border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 2px 8px #0f172a0a; }
    .card span { display:block; color:var(--muted); font-size:13px; }
    .card strong { display:block; margin-top:5px; font-size:25px; }
    .pass strong { color:var(--green); } .fail strong { color:var(--red); }
    .rules { background:#eff6ff; border-left:4px solid var(--blue); padding:12px 18px; border-radius:8px; line-height:1.8; }
    .table-wrap { overflow-x:auto; background:white; border:1px solid var(--line); border-radius:10px; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; font-size:14px; }
    th { position:sticky; top:0; background:#f1f5f9; font-weight:700; }
    th,td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:right; }
    th:nth-child(2),td:nth-child(2),th:last-child,td:last-child { text-align:left; }
    tbody tr:hover { background:#f8fbff; }
    .empty,.error { color:var(--muted); padding:18px; } .error { color:var(--red); }
    @media(max-width:700px) { main { width:100%; margin-top:0; padding:16px; } .cards { grid-template-columns:repeat(2,1fr); } h1 { font-size:23px; } }
  </style>
</head>
<body><main>
  <div class="head"><div><h1>股票二次筛选结果</h1><div class="meta" id="meta">正在加载…</div></div><label>日期：<select id="date"></select></label></div>
  <section class="cards">
    <div class="card"><span>第一阶段候选</span><strong id="candidates">-</strong></div>
    <div class="card pass"><span>二筛通过</span><strong id="passed-count">-</strong></div>
    <div class="card fail"><span>二筛剔除</span><strong id="failed-count">-</strong></div>
    <div class="card"><span>数据失败</span><strong id="errors-count">-</strong></div>
  </section>
  <h2>筛选条件</h2>
  <div class="rules" id="rules"></div>
  <h2>通过（评分从高到低）</h2><div class="table-wrap" id="passed"></div>
  <h2>剔除</h2><div class="table-wrap" id="failed"></div>
  <script>
    const text = value => value === null || value === undefined ? '-' : String(value);
    function table(rows) {
      if (!rows.length) return '<p class="empty">暂无数据</p>';
      const el = document.createElement('table');
      const head = el.createTHead().insertRow();
      Object.keys(rows[0]).forEach(k => { const th=document.createElement('th'); th.textContent=k; head.appendChild(th); });
      const body = el.createTBody();
      rows.forEach(row => { const tr=body.insertRow(); Object.values(row).forEach(v => { const td=tr.insertCell(); td.textContent=text(v); }); });
      return el;
    }
    async function load(date) {
      try {
        const response = await fetch(`data/${date}.json`, {cache:'no-store'});
        if (!response.ok) throw new Error(`没有 ${date} 的报告`);
        const data = await response.json();
        document.title = `${date} 股票二次筛选结果`;
        document.getElementById('meta').textContent = `数据日期：${data.date}　更新时间：${data.generated_at}`;
        document.getElementById('candidates').textContent = data.summary.candidates;
        document.getElementById('passed-count').textContent = data.summary.passed;
        document.getElementById('failed-count').textContent = data.summary.failed;
        document.getElementById('errors-count').textContent = data.summary.data_errors;
        document.getElementById('rules').textContent = `① 10日内涨停　② 5日内首次回踩MA10　③ 日线上涨一笔不超过 ${data.max_daily_rise_days} 天　④ 30分钟MACD回抽0轴不超过 ${data.max_pullbacks} 次　⑤ 向下5分钟笔中枢质量不低于 ${data.min_center_quality} 分`;
        for (const [id, rows] of [['passed',data.passed],['failed',data.failed]]) { const box=document.getElementById(id); box.replaceChildren(table(rows)); }
      } catch (error) {
        document.getElementById('meta').textContent = error.message;
        document.getElementById('passed').innerHTML = `<p class="error">${error.message}</p>`;
      }
    }
    (async () => {
      const manifest = await fetch('data/index.json', {cache:'no-store'}).then(r => r.json());
      const requested = new URLSearchParams(location.search).get('date');
      const date = /^\d{8}$/.test(requested || '') ? requested : manifest.latest;
      const select = document.getElementById('date');
      manifest.dates.forEach(d => { const option=new Option(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}`,d,d===date,d===date); select.add(option); });
      if (!manifest.dates.includes(date)) select.add(new Option(date,date,true,true),0);
      select.onchange = () => { const url=new URL(location.href); url.searchParams.set('date',select.value); location.href=url; };
      load(date);
    })();
  </script>
</main></body></html>
