<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新模型选股推荐</title><style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#172033;margin:0}main{width:min(1500px,96%);margin:24px auto}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 24px;border:1px solid #ccd5e1;background:#fff;border-radius:8px;cursor:pointer}.tabs .on{background:#2563eb;color:#fff}.model{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:16px;margin:15px 0}.rules{color:#475569;line-height:1.8}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e5eaf0;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}th{background:#eef2f7}.hide{display:none}.meta{color:#64748b}</style></head><body><main><h1>新模型选股推荐</h1><div id="meta" class="meta"></div><div class="tabs"><button data-tab="short" class="on">短线</button><button data-tab="long">长线</button></div><div id="content"></div><script>
const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function table(rows){if(!rows.length)return '<p>暂无严格符合条件的股票。</p>';let ks=Object.keys(rows[0]);return '<div class="wrap"><table><thead><tr>'+ks.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+ks.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}let data,tab='short';function draw(){let names=tab==='short'?['T+1','T1-T5']:['中线'];document.getElementById('content').innerHTML=names.map(n=>`<section class="model"><h2>${n}（${data.models[n].rows.length}只）</h2><div class="rules">${esc(data.models[n].rules)}</div>${table(data.models[n].rows)}</section>`).join('');document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});fetch('data/new_models_latest.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;document.getElementById('meta').textContent=`数据日：${x.date}　生成：${x.generated_at}　五笔优先于三笔`;draw()})</script></main></body></html>
