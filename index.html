<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新模型选股推荐</title><style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#172033;margin:0}main{width:min(1500px,96%);margin:24px auto}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 24px;border:1px solid #ccd5e1;background:#fff;border-radius:8px;cursor:pointer}.tabs .on{background:#2563eb;color:#fff}.focus,.gate,.model{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:16px;margin:15px 0}.focus{border-color:#bfdbfe}.focus h2,.focus p{margin-top:0}.focus .note{color:#475569;line-height:1.8}.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gate label{font-weight:700}.gate input{width:150px;padding:9px 10px;border:1px solid #ccd5e1;border-radius:8px}.gate button{padding:9px 16px;border:1px solid #2563eb;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.gate span{color:#64748b}.model-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.model-title h2{margin:0;font-size:28px;line-height:1.2}.counts{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#eef6ff;color:#1d4ed8;font-size:14px;font-weight:700}.badge.obs{background:#fff7ed;color:#c2410c}.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;margin-bottom:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}.sub-title{display:flex;align-items:baseline;gap:8px}.subhead h3{margin:0;font-size:17px;line-height:1.2}.hint{color:#64748b;font-size:13px}.count-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#fff;color:#334155;border:1px solid #e2e8f0;font-size:13px;font-weight:700}.rules{color:#475569;line-height:1.8}.rules.locked{color:#94a3b8}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e5eaf0;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}th{background:#eef2f7}.hide{display:none}.meta{color:#64748b}@media(max-width:640px){.model-title{align-items:flex-start;flex-direction:column}.model-title h2{font-size:24px}.subhead{align-items:flex-start;flex-direction:column}}</style></head><body><main><h1>新模型选股推荐</h1><div id="meta" class="meta"></div><div id="focus"></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"><button data-tab="short" class="on">短线</button><button data-tab="long">长线</button></div><div id="content"></div><script>
const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function table(rows,emptyText='暂无股票。'){if(!rows.length)return `<p>${esc(emptyText)}</p>`;let ks=Object.keys(rows[0]);return '<div class="wrap"><table><thead><tr>'+ks.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+ks.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}
const RULE_HASH='aee73035ea60b04c339e9363202e5c4c1aac91fa8a0d55c8487fbcf51a1c2ef2';
let data,tab='short',rulesUnlocked=sessionStorage.getItem('rulesUnlocked')==='1';
async function sha256(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function syncGate(){document.getElementById('ruleMsg').textContent=rulesUnlocked?'条件已解锁':'条件已隐藏'}
function drawFocus(focus){if(!focus||!focus.rows||!focus.rows.length)return;let note=focus.note?`<p class="note">${esc(focus.note)}</p>`:'';let title=focus.title||'明日重点盯位';document.getElementById('focus').innerHTML=`<section class="focus"><h2>${esc(title)}</h2>${note}${table(focus.rows,'暂无重点盯位。')}</section>`}
function draw(){let names=tab==='short'?['缠论激进','T+1','T1-T5']:['中线'];document.getElementById('content').innerHTML=names.map(n=>{let m=data.models[n],obs=m.observation_rows||[],rules=rulesUnlocked?esc(m.rules):'条件已隐藏，输入口令后查看。',locked=rulesUnlocked?'':' locked';return `<section class="model"><div class="model-title"><h2>${n}</h2><div class="counts"><span class="badge">已确认 ${m.rows.length}</span><span class="badge obs">观察 ${obs.length}</span></div></div><div class="rules${locked}">${rules}</div><div class="subhead"><div class="sub-title"><h3>已确认</h3></div><span class="count-pill">${m.rows.length} 只</span></div>${table(m.rows,'暂无严格符合条件的股票。')}<div class="subhead"><div class="sub-title"><h3>观察池</h3><span class="hint">含结构待确认</span></div><span class="count-pill">${obs.length} 只</span></div>${table(obs,'暂无观察池股票。')}</section>`}).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));syncGate()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.getElementById('unlockRules').onclick=async()=>{let ok=await sha256(document.getElementById('rulePass').value)===RULE_HASH;rulesUnlocked=ok;if(ok){sessionStorage.setItem('rulesUnlocked','1');document.getElementById('rulePass').value='';draw()}else{document.getElementById('ruleMsg').textContent='口令不正确'}};document.getElementById('rulePass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlockRules').click()});Promise.all([fetch('data/new_models_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/focus_latest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([x,focus])=>{data=x;document.getElementById('meta').textContent=`数据日：${x.date}　生成：${x.generated_at}　五笔优先于三笔`;drawFocus(focus);draw()})</script></main></body></html>
