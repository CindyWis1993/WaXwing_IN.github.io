</style></head><body><main><a href="patterns.html">&#24418;&#24577;&#36873;&#32929; &#183; &#21452;&#27169;&#26495; Top5 / &#21382;&#21490;&#22797;&#30424; &#8594;</a><h1>新模型选股推荐</h1><div id="meta" class="meta"></div><section id="focusWatch" class="focus-watch" aria-label="下一交易日重点盯盘"></section><div class="review-bar"><button id="openPerformance" class="review-btn" type="button">历史命中复盘 <span id="performanceCount" class="review-count">0</span></button><span id="performanceBrief" class="review-brief">点击查看最近3个工作日</span></div><div id="performanceModal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="performanceTitle"><div class="modal-panel"><div class="modal-head"><h2 id="performanceTitle">历史命中复盘</h2><button id="closePerformance" class="modal-close" type="button" aria-label="关闭">×</button></div><div id="performance" class="modal-body"></div></div></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"><button data-tab="focus" class="on">重点模型</button><button data-tab="strict">严格条件</button><button data-tab="long">中线</button></div><div id="content"></div><script>

function drawFocus(payload){
    const box=document.getElementById('focusWatch'),f=payload.focus_watchlist;
    if(!f){box.innerHTML='<h2>下一交易日重点盯盘</h2><p class="focus-note">本期尚未生成重点名单，等待下一次正式扫描。</p>';return}
    const preview=payload.is_intraday_preview||f.status==='preview';
    const price=value=>Number(value).toFixed(2);
    const cards=(f.picks||[]).map(p=>`<article class="focus-card"><h3>${esc(p['重点排名'])}. ${esc(p['名称'])} <small>${esc(p['代码'])}</small></h3><span class="badge">${esc(p['模型'])} · 原排名 ${esc(p['原排名'])}${p['历史近邻Top3']&&p['历史近邻Top3']['可排序']?' · 近邻投票'+esc(p['历史近邻Top3']['近邻综合分']):p['形态相似度']!==null&&p['形态相似度']!==undefined?' · 形态'+esc(p['形态相似度']):''}${p['缩量蓄势匹配']?' · 缩量蓄势5/5':''}${p['20日强趋势匹配']?' · 强趋势再加速5/5':''}</span><ul>${p['入选依据'].map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="focus-level"><strong>转强观察：</strong>站上信号日高点 ${price(p['信号高点'])} 后，观察回踩能否守住。</p><p><strong>均线参照：</strong>${esc(p['均线'])} ${price(p['均线值'])}，${p['检查']['收在均线上']?'失守则降低优先级':'目前尚未站回，先等待修复'}；跌破信号日低点 ${price(p['信号低点'])} 取消本轮观察。</p></article>`).join('');
    const votePicks=(f.ma10_neighbor_watch||[]).filter(p=>p['历史近邻Top3']&&p['历史近邻Top3']['可排序']);
    const voteTable=votePicks.length?`<div class="focus-vote-table"><h3>10日线Top3近邻投票对照</h3><p class="focus-note">独立展示10日线组内前三，不改变上方最终重点名单。</p><table><thead><tr><th>当前票</th><th>Top3历史样本</th><th>次日上涨率</th><th>次日涨停率</th><th>最大回撤</th></tr></thead><tbody>${votePicks.map(p=>{const v=p['历史近邻Top3'],names=v['历史样本'].map(s=>`${esc(s['名称'])} ${Number(s['次日涨跌幅%'])>=0?'+':''}${esc(s['次日涨跌幅%'])}%`).join(' / ');return `<tr><td>${esc(p['近邻排名'])}. ${esc(p['名称'])}</td><td>${names}</td><td>${esc(v['次日上涨率%'])}%</td><td>${esc(v['次日涨停率%'])}%</td><td>${esc(v['次日盘中最大回撤%'])}%</td></tr>`}).join('')}</tbody></table></div>`:'';
    const replay=payload.report_type==='rule_replay';
    box.innerHTML=`<div class="focus-heading"><h2>${replay?'规则重算观察（非盘前预测）':preview?'午盘重点观察':'下一交易日重点盯盘'}</h2><span class="badge">${replay?'重算对照 · 不计复盘':preview?'非最终 · 不计复盘':'试行 · 待验证'} ${f.picks.length}只</span></div><p class="focus-note">信号日 ${esc(f.selection_date)} · 从${f.candidate_count}只原候选中另选最多3只，独立挑选不改变模型列表及排名。${preview?'仅午盘临时参考，收盘重新筛选。':'以下价格为信号日收盘后的观察参照，不是实时行情。'}</p>${cards?`<div class="focus-grid">${cards}</div>`:'<p>暂无具备完整同日行情的候选，本期留空。</p>'}${voteTable}<details><summary>筛选依据与验证说明</summary><p>${esc(f.rules)}</p><p>规则版本：${esc(f.version)}；名单记录时间：${esc(f.recorded_at)}。只对事前保存的重点名单做次日复盘，未记录的历史不事后补选。</p></details><p class="focus-note">观察名单不等于买入指令；需等待次日确认，跳空高开不等于合适买点。复盘涨幅是收盘到收盘表现，不是可实现交易收益。</p>`;
}
function focusReview(session,model){
    const review=session['重点盯盘'];
    if(!review)return '<p class="focus-note">本期尚未记录重点名单，不事后回填。</p>';
    const allRows=[...(review.rows||[])].sort((a,b)=>a['重点排名']-b['重点排名']);
    if(!allRows.length)return '<p class="focus-note">本期重点名单没有可结算行情。</p>';
    const rows=allRows.filter(r=>r['模型']===model),q=performanceSummary(allRows);
    const location=rows.length?`当前${esc(model)}表内有${rows.length}只，已在原排名行标星。`:`当前${esc(model)}表内没有；请切换另一模型Tab查看星标位置。`;
    return `<div class="focus-review"><strong>当时额外精选（跨模型）</strong> · ${esc(review.version)}<br>${allRows.map(r=>`${esc(r['重点排名'])}. ${esc(r['名称'])}（${esc(r['模型'])}原排名${esc(r['排名'])}）：${performancePercent(r['次日涨跌幅%'])}`).join('；')}<br>3只整体上涨率 ${performancePercent(q.upRate)} · 平均 ${performancePercent(q.average)}。${location}仅对比收盘表现，不代表交易收益。</div>`;
}

const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tableSorts=new Map();
function toggleTableSort(id,key){let current=tableSorts.get(id);tableSorts.set(id,{key,direction:current&&current.key===key?-current.direction:(key==='排名'?1:-1)});draw()}
function table(rows,emptyText='暂无股票。',id=''){
if(!rows.length)return `<p>${esc(emptyText)}</p>`;
let ks=Object.keys(rows[0]);if(ks.includes('排名'))ks=['排名',...ks.filter(k=>k!=='排名')];
let sortable=id&&ks.includes('排名'),sort=sortable?(tableSorts.get(id)||{key:'排名',direction:1}):null;
let displayed=[...rows];if(sort)displayed.sort((a,b)=>{let av=a[sort.key],bv=b[sort.key],am=av==null||av===''||!Number.isFinite(Number(av)),bm=bv==null||bv===''||!Number.isFinite(Number(bv));return am||bm?(am===bm?0:am?1:-1):(Number(av)-Number(bv))*sort.direction});
const cell=(key,value)=>{let number=Number(value),signed=key==='距涨停日开盘价%'&&value!==null&&value!==''&&Number.isFinite(number),shown=signed&&number>0?`+${value}`:value,cls=signed?(number>0?'pos':(number<0?'neg':'flat')):'';return `<td${cls?` class="${cls}"`:''}>${esc(shown)}</td>`};
return '<div class="wrap"><table><thead><tr>'+ks.map(k=>{let canSort=sortable&&['排名','复涨特征分'].includes(k),active=sort&&sort.key===k;return `<th${canSort?` aria-sort="${active?(sort.direction===1?'ascending':'descending'):'none'}"`:''}>${canSort?`<button type="button" class="sort-button${active?' active':''}" data-sort-table="${esc(id)}" data-sort-key="${esc(k)}">${esc(k)} ${active?(sort.direction===1?'↑':'↓'):'↕'}</button>`:esc(k)}</th>`}).join('')+'</tr></thead><tbody>'+displayed.map(r=>'<tr>'+ks.map(k=>cell(k,r[k])).join('')+'</tr>').join('')+'</tbody></table></div>'}

const RULE_HASH='aee73035ea60b04c339e9363202e5c4c1aac91fa8a0d55c8487fbcf51a1c2ef2';
let data,tab='focus',rulesUnlocked=sessionStorage.getItem('rulesUnlocked')==='1';
async function sha256(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function syncGate(){document.getElementById('ruleMsg').textContent=rulesUnlocked?'条件已解锁':'条件已隐藏'}
const performanceModels=['首踩10日线','首踩20日线'];
let performanceModel=performanceModels[0],performanceData=null;
let performanceDate=null;
const performancePanel=document.getElementById('performance');
const performanceTabs=document.createElement('div');
performanceTabs.className='review-tabs';
performanceTabs.setAttribute('role','tablist');
performanceTabs.setAttribute('aria-label','复盘模型');
performanceTabs.innerHTML=performanceModels.map((name,i)=>`<button type="button" role="tab" id="performance-tab-${i}" aria-controls="performance" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-review-model="${name}">${name}</button>`).join('');
performancePanel.before(performanceTabs);
performancePanel.setAttribute('role','tabpanel');
performancePanel.setAttribute('aria-labelledby','performance-tab-0');
performancePanel.setAttribute('tabindex','0');
function selectPerformanceModel(name){
    if(!performanceModels.includes(name))return;
    performanceModel=name;
    drawPerformance(performanceData);
    performancePanel.scrollTop=0;
    performanceTabs.querySelector('[aria-selected="true"]').focus();
}
performanceTabs.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-model]');
    if(button)selectPerformanceModel(button.dataset.reviewModel);
});
performanceTabs.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const index=performanceModels.indexOf(performanceModel);
    const next=event.key==='Home'?0:event.key==='End'?performanceModels.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+performanceModels.length)%performanceModels.length;
    selectPerformanceModel(performanceModels[next]);
});
performancePanel.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(button){performanceDate=button.dataset.reviewDate;drawPerformance(performanceData)}
});
performancePanel.addEventListener('keydown',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(!button||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const buttons=[...performancePanel.querySelectorAll('button[data-review-date]')],index=buttons.indexOf(button);
    const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
    buttons[next].click();buttons[next].focus();
});
function performanceSummary(rows){
    const valid=rows.filter(r=>r['次日涨跌幅%']!=null&&r['次日涨跌幅%']!==''&&Number.isFinite(Number(r['次日涨跌幅%'])));
    const changes=valid.map(r=>Number(r['次日涨跌幅%']));
    const up=changes.filter(value=>value>0).length;
    return {
        total:rows.length,valid:valid.length,up,
        down:changes.filter(value=>value<0).length,
        limitUp:valid.filter(r=>r['结果']==='涨停').length,
        upRate:valid.length?(up/valid.length*100).toFixed(1):null,
        average:valid.length?(changes.reduce((sum,value)=>sum+value,0)/valid.length).toFixed(2):null
    };
}
const performancePercent=value=>value==null?'—':`${value}%`;
function performanceTable(rows,review=null){
    if(!rows.length)return `<p>当日无${esc(performanceModel)}正式入选股票。</p>`;
    const focusRanks=new Map((review?.rows||[]).map(row=>[`${row['模型']}|${row['代码']}`,row['重点排名']]));
    const keys=['排名','代码','名称','选股收盘','次日收盘','次日涨跌幅%','结果','额外精选'];
    return '<div class="wrap"><table><thead><tr>'+keys.map(key=>`<th>${key==='排名'?'选股时排名':esc(key)}</th>`).join('')+
        '</tr></thead><tbody>'+rows.map(row=>{const focusRank=focusRanks.get(`${row['模型']}|${row['代码']}`);return `<tr${focusRank!=null?' class="focus-history-row"':''}>`+keys.map(key=>{
            if(key==='额外精选')return '<td>'+(focusRank!=null?'<span class="focus-history-badge">★ 第'+esc(focusRank)+'</span>':'—')+'</td>';
            const value=row[key],cls=key==='次日涨跌幅%'?(Number(value)>0?'pos':(Number(value)<0?'neg':'flat')):'';
            return `<td class="${cls}">${esc(value)}</td>`;
        }).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}
function drawPerformance(perf){
    performanceData=perf;
    const history=(perf&&perf.history||[]).slice(0,3);
    const count=document.getElementById('performanceCount'),brief=document.getElementById('performanceBrief');
    performanceTabs.querySelectorAll('button').forEach((button,i)=>{
        const selected=button.dataset.reviewModel===performanceModel;
        button.setAttribute('aria-selected',String(selected));
        button.tabIndex=selected?0:-1;
        if(selected)performancePanel.setAttribute('aria-labelledby',`performance-tab-${i}`);
    });
    count.textContent=history.length;
    if(!history.length){
        const pending=perf&&perf.pending?`已记录 ${esc(perf.pending['选股日'])} 的选股，下一交易日收盘后生成复盘。`:'历史复盘从下一次完整运行开始记录。';
        brief.textContent='尚无已结算结果';
        performancePanel.innerHTML=`<p class="note">${esc(performanceModel)}暂无已结算结果。${pending} 最多保留最近3个已复盘工作日。</p>`;
        return;
    }
    const latestRows=(history[0].rows||[]).filter(row=>row['模型']===performanceModel);
    const latest=performanceSummary(latestRows);
    brief.textContent=`${performanceModel}最近一期：上涨率 ${performancePercent(latest.upRate)}，平均 ${performancePercent(latest.average)}`;
    if(!history.some(session=>session['选股日']===performanceDate))performanceDate=history[0]['选股日'];
    const session=history.find(item=>item['选股日']===performanceDate)||history[0];
    const dateTabs=`<div class="review-date-tabs" role="tablist" aria-label="复盘日期">${history.map(item=>{const selected=item['选股日']===performanceDate;return `<button type="button" role="tab" aria-selected="${selected}" tabindex="${selected?0:-1}" data-review-date="${esc(item['选股日'])}"><strong>选股日 ${esc(item['选股日'])}</strong><span>→ ${esc(item['结果日'])}</span></button>`}).join('')}</div>`;
    const rows=(session.rows||[]).filter(row=>row['模型']===performanceModel);
    const q=performanceSummary(rows);
    const market=session.market_context?.state?`<span class="metric">大盘 ${esc(session.market_context.state)}</span>`:'';
    const content=`<section class="session active-session"><div class="session-title"><strong>选股日 ${esc(session['选股日'])} → 结果日 ${esc(session['结果日'])}</strong><span>有效结果 ${q.valid}/${q.total} 只</span></div><div class="metrics">${market}<span class="metric">上涨率 ${performancePercent(q.upRate)}</span><span class="metric">平均涨幅 ${performancePercent(q.average)}</span><span class="metric">上涨 ${q.up}</span><span class="metric">下跌 ${q.down}</span><span class="metric">涨停 ${q.limitUp}</span></div>${focusReview(session,performanceModel)}<h3>逐股结果</h3>${performanceTable(rows,session["重点盯盘"])}</section>`;
    performancePanel.innerHTML=`<p class="note">先选日期，再查看10日线或20日线。只统计正式入选股票的次日表现；选股时排名沿用当时保存的顺序。</p>${dateTabs}${content}`;
}
function draw(){const groups={focus:['首踩10日线','首踩20日线'],strict:['T+1','T1-T5'],long:['中线']};const preferred=data.market_context?.preferred_model||'首踩20日线';let names=groups[tab];if(tab==='focus')names=[preferred,...names.filter(n=>n!==preferred)];document.getElementById('content').innerHTML=names.map(n=>{let m=data.models[n],obs=m.observation_rows||[],rules=rulesUnlocked?esc(m.rules):'条件已隐藏，输入口令后查看。',locked=rulesUnlocked?'':' locked';let simple=n==='首踩10日线'||n==='首踩20日线',featured=n===preferred;return `<section class="model${featured?' featured':''}"><div class="model-title"><h2>${n}</h2><div class="counts">${featured?'<span class="badge key">重点</span>':''}<span class="badge">${simple?'推荐':'已确认'} ${m.rows.length}</span>${simple?'':`<span class="badge obs">观察 ${obs.length}</span>`}</div></div><p class="meta">${simple?esc(data.market_context?.reason||'优先观察首踩20日线'):''}</p><div class="rules${locked}">${rules}</div>${rulesUnlocked&&m.implementation?`<details class="implementation"><summary>当前计算口径（与原文分开）</summary><p>${esc(m.implementation)}</p></details>`:""}<div class="subhead"><div class="sub-title"><h3>${simple?'次日观察':'已确认'}</h3></div><span class="count-pill">${m.rows.length} 只</span></div>${table(m.rows,'暂无严格符合条件的股票。',n)}${simple?'':`<div class="subhead"><div class="sub-title"><h3>观察池</h3><span class="hint">含结构待确认</span></div><span class="count-pill">${obs.length} 只</span></div>${table(obs,'暂无观察池股票。')}`}</section>`}).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));syncGate()}
document.getElementById('content').addEventListener('click',e=>{let button=e.target.closest('button[data-sort-key]');if(button)toggleTableSort(button.dataset.sortTable,button.dataset.sortKey)});
const performanceModal=document.getElementById('performanceModal');function closePerformance(){performanceModal.classList.add('hide');document.body.classList.remove('modal-open')}document.getElementById('openPerformance').onclick=()=>{performanceModal.classList.remove('hide');document.body.classList.add('modal-open')};document.getElementById('closePerformance').onclick=closePerformance;performanceModal.onclick=e=>{if(e.target===performanceModal)closePerformance()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePerformance()});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.getElementById('unlockRules').onclick=async()=>{let ok=await sha256(document.getElementById('rulePass').value)===RULE_HASH;rulesUnlocked=ok;if(ok){sessionStorage.setItem('rulesUnlocked','1');document.getElementById('rulePass').value='';draw()}else{document.getElementById('ruleMsg').textContent='口令不正确'}};document.getElementById('rulePass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlockRules').click()});Promise.all([fetch('data/new_models_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/model_performance_latest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([x,performance])=>{data=x;document.getElementById('meta').textContent=`行情数据日：${x.daily_date||x.date}　生成时间：${x.generated_at}`;drawPerformance(performance);if(x.report_type==="rule_replay"){const notice=document.createElement("p");notice.className="gate";notice.textContent="规则重算对照：仍使用"+(x.daily_date||x.date)+"收盘数据，不是今日实时行情；本次不覆盖已记录的盘前名单、不计入今日命中复盘。";document.getElementById("meta").after(notice)}drawFocus(x);draw()})</script></main></body></html>
